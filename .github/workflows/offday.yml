name: Offday

on:
  pull_request:
    paths:
      - 'apps/offday/**'
      - '.github/workflows/offday.yml'
  push:
    branches: [main]
    paths:
      - 'apps/offday/**'
      - '.github/workflows/offday.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offday-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-checks:
    name: Offday production checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/offday
    env:
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/offday/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build production app
        run: npm run build
      - name: Test production server
        run: npm test
