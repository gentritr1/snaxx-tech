<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Geo Guesser World 3D! artwork: a wireframe globe with a dropped map pin">
  <defs>
    <radialGradient id="gg-glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#134e4a" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#0f2033" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0b1120" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gg-sphere" x1="18%" y1="10%" x2="82%" y2="94%">
      <stop offset="0%" stop-color="#1e3a45" />
      <stop offset="52%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="gg-pin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <clipPath id="gg-clip">
      <circle cx="400" cy="278" r="168" />
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="#0b1120" />
  <rect width="800" height="600" fill="url(#gg-glow)" />

  <!-- Faint coordinate grid -->
  <g stroke="#2dd4bf" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M0 500H800" />
    <path d="M100 0V600M200 0V600M300 0V600M400 0V600M500 0V600M600 0V600M700 0V600" />
  </g>

  <!-- Globe -->
  <circle cx="400" cy="278" r="168" fill="url(#gg-sphere)" />
  <g clip-path="url(#gg-clip)" fill="none" stroke="#2dd4bf" stroke-opacity="0.34" stroke-width="1.5">
    <!-- Latitudes -->
    <ellipse cx="400" cy="168" rx="127" ry="27" />
    <ellipse cx="400" cy="223" rx="158" ry="34" />
    <ellipse cx="400" cy="278" rx="168" ry="36" />
    <ellipse cx="400" cy="333" rx="158" ry="34" />
    <ellipse cx="400" cy="388" rx="127" ry="27" />
    <!-- Longitudes -->
    <ellipse cx="400" cy="278" rx="168" ry="168" />
    <ellipse cx="400" cy="278" rx="112" ry="168" />
    <ellipse cx="400" cy="278" rx="56" ry="168" />
    <path d="M400 110V446" />
  </g>
  <circle cx="400" cy="278" r="168" fill="none" stroke="#2dd4bf" stroke-opacity="0.55" stroke-width="2" />

  <!-- Guess trail: where you dropped the pin, and where it actually was -->
  <path
    d="M317 356 Q 372 300 452 232"
    fill="none"
    stroke="#5eead4"
    stroke-opacity="0.7"
    stroke-width="2"
    stroke-dasharray="7 8"
    stroke-linecap="round"
  />
  <circle cx="317" cy="356" r="7" fill="#0b1120" stroke="#5eead4" stroke-width="2.5" />

  <!-- Dropped pin -->
  <g transform="translate(452 232)">
    <ellipse cx="0" cy="4" rx="16" ry="5" fill="#2dd4bf" fill-opacity="0.22" />
    <path d="M0 2c-11-14-16-21-16-29a16 16 0 0 1 32 0c0 8-5 15-16 29Z" fill="url(#gg-pin)" />
    <circle cx="0" cy="-27" r="5.5" fill="#0b1120" />
  </g>

  <!-- Wordmark -->
  <text
    x="400"
    y="516"
    text-anchor="middle"
    font-family="Geist, 'Segoe UI', system-ui, sans-serif"
    font-size="46"
    font-weight="600"
    letter-spacing="-1.4"
    fill="#e5e7eb"
  >Geo Guesser World 3D!</text>
  <text
    x="400"
    y="552"
    text-anchor="middle"
    font-family="'Geist Mono', ui-monospace, 'Cascadia Mono', monospace"
    font-size="16"
    letter-spacing="4.5"
    fill="#94a3b8"
  >DROPPED SOMEWHERE ON EARTH</text>
</svg>
